[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddock-pulse"
version = "0.1.0"
description = "Turn FastF1 race data into social posts, image prompts, images and voiceovers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
paddockpulse = "paddock_pulse.main:main"

[project.urls]
Repository = "https://github.com/bluzername/paddock-pulse"

[tool.setuptools]
packages = ["paddock_pulse"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Syntax errors, undefined names and misuse only. Style rules are intentionally off.
select = ["E9", "F63", "F7", "F82"]
