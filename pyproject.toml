[tool.poetry]
name = "paddock-pulse"
version = "0.1.0"
description = "F1 FlashPoint: A Formula 1 insights-driven content engine"
authors = ["Evy"]
readme = "README.md"
packages = [{include = "paddock_pulse"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
fastf1 = "^3.2.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
cachetools = "^5.3.2"
httpx = "^0.27.0"
requests = "^2.31.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"
jinja2 = "^3.1.2"
tiktoken = "^0.6.0"
pillow = "^10.2.0"
opencv-python = "^4.9.0"
moviepy = "^1.0.3"
pytest = "^8.0.0"
rich = "^13.7.0"
loguru = "^0.7.2"
python-multipart = "^0.0.7"
openai = "^1.12.0"
stability-sdk = "^0.8.0"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
