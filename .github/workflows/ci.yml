name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (syntax errors and undefined names)
        run: ruff check .
      - name: Byte-compile all modules
        run: python -m compileall -q -x '(\.venv|build|dist)/' .
